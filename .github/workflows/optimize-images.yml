name: Optimize new images
# Όταν ανεβαίνει νέα φωτογραφία στο images/, φτιάχνει αυτόματα την ελαφριά έκδοση WebP στο images/web/
on:
  push:
    branches: [main]
    paths: ["images/**", "!images/web/**"]
permissions:
  contents: write
jobs:
  webp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - name: Create missing WebP files
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          out = Path("images/web"); out.mkdir(exist_ok=True)
          for f in Path("images").iterdir():
              if f.suffix.lower() in {".png", ".jpg", ".jpeg"} and f.name != "zz.jpg":
                  t = out / (f.stem + ".webp")
                  if not t.exists():
                      im = ImageOps.exif_transpose(Image.open(f)).convert("RGB")
                      im.thumbnail((1400, 1400))
                      im.save(t, "WEBP", quality=80, method=6)
                      print("created", t)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/web
          git diff --cached --quiet || (git commit -m "Auto: WebP versions of new images" && git push)
